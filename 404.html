<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/head.js"></script>
  <title>Page Not Found | Let Us Optimize</title>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .not-found { width: min(100%, 980px); min-height: 520px; display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 7vw, 84px); overflow: hidden; border-radius: 22px; color: #fff; background: radial-gradient(ellipse at 95% 90%, rgba(255,56,0,.23), transparent 42%), #090908; }
    .not-found__brand { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 54px; font-weight: 700; font-size: 1.05rem; }
    .not-found__mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 50%; color: #fff; background: #ff3800; font-size: 1.35rem; }
    .not-found__code { margin: 0 0 12px; color: #ff5930; font-size: .8rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .not-found h1 { max-width: 720px; margin: 0; font-size: clamp(2.5rem, 7vw, 5.5rem); line-height: .99; letter-spacing: -.055em; }
    .not-found__copy { max-width: 560px; margin: 24px 0 30px; color: #d1cec8; }
    .not-found__actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .not-found__button { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 48px; padding: 12px 18px; border-radius: 6px; background: #ff3800; color: white; font-weight: 700; }
    .not-found__button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .not-found__home-link { display: inline-flex; align-items: center; color: #fff; padding: 12px 4px; text-decoration: underline; text-underline-offset: 4px; }
    @media (max-width: 600px) { .not-found { min-height: 440px; border-radius: 14px; } .not-found__brand { margin-bottom: 42px; } }
  </style>
</head>
<body>
  <main class="not-found">
    <a class="not-found__brand" href="/" aria-label="Let Us Optimize home">
      <span class="not-found__mark" aria-hidden="true">↗</span>
      <span>Let Us Optimize</span>
    </a>
    <p class="not-found__code">404 · Page not found</p>
    <h1>This page seems to have wandered off.</h1>
    <p class="not-found__copy">The link may be outdated or the page may have moved. Let's get you back on track.</p>
    <div class="not-found__actions">
      <a class="not-found__button" href="/">Back to homepage <span aria-hidden="true">↗</span></a>
      <a class="not-found__home-link" href="/#services">Explore our services</a>
    </div>
  </main>
</body>
</html>
